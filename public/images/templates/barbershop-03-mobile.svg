  <rect x="724" y="204" width="152" height="26" rx="13" fill="#1a1a1d"/>
  <!-- App content -->
  <text x="652" y="300" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="5">CUTZ<span fill="#ffbd39">.</span></text>
