    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd76e"/>
      <stop offset="100%" stop-color="#e9a820"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="130" font-family="Arial, sans-serif" font-size="20" fill="#6c6c74" letter-spacing="6" text-anchor="middle">MOBILE ANSICHT</text>
