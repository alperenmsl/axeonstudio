  <text x="922" y="672" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffbd39" text-anchor="end">€ 25</text>
  <text x="678" y="686" font-family="Arial, sans-serif" font-size="14" fill="#9a9aa2">Waschen, Schneiden, Styling</text>
